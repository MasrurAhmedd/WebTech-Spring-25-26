<!DOCTYPE html>
<html lang="eng">
<head>
<title> Product Management Page </title>
<link rel="stylesheet" href="../Design/Sstyle.css">
<script src="../JS/Validation_script.js"></script>
</head>
<body>
<div class="header">
    <h1> Product Management Page </h1>
</div>

<form>
<fieldset>
<legend> Product Management Page </legend>

<label for="UnitPrice">Unit Price:</label><br>
<input type="number" id="UnitPrice" name="UnitPrice" value="1000" readonly>
<br><br>

<label for="Quantity">Quantity per Day:</label><br>
<input type="number" id="Quantity" name="Quantity" placeholder="Enter quantity per day" oninput="calculate_total()">
<br><br>

<label for="TotalPrice">Total Price for 30 Days:</label><br>
<input type="number" id="TotalPrice" name="TotalPrice" value="0" readonly>
<br><br>

</fieldset>
</form>
</body>
</html>
